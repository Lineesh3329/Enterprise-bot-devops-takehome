replicaCount: 2

image:
  repository: demo-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  appName: demo-app
  version: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
